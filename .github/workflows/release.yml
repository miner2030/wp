name: Release Rust Binaries

on:
  push:
    branches: [ "main" ]          # 每次提交到 main 就触发
  workflow_dispatch:              # 也支持手动触发

permissions:
  contents: write                 # 需要创建/更新 Release

jobs:
  build-and-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: wp-linux-amd64
            archive_ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: wp-windows-amd64.exe
            archive_ext: zip
          - os: macos-latest
            target: x86_64-apple-darwin
            asset_name: wp-macos-x86_64
            archive_ext: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_name: wp-macos-arm64
            archive_ext: tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          BINARY=target/${{ matrix.target }}/release/wp
          ARCHIVE=wp-${{ matrix.target }}.${{ matrix.archive_ext }}
          tar -czvf "$ARCHIVE" -C target/${{ matrix.target }}/release wp
          echo "ARCHIVE=$ARCHIVE" >> $GITHUB_ENV
          echo "ASSET_NAME=${{ matrix.asset_name }}" >> $GITHUB_ENV

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $Archive = "wp-${{ matrix.target }}.zip"
          Compress-Archive -Path "target/${{ matrix.target }}/release/wp.exe" -DestinationPath $Archive
          echo "ARCHIVE=$Archive" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "ASSET_NAME=${{ matrix.asset_name }}" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload to GitHub Release (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest                    # 固定用 latest 标签
          name: Latest Build (${{ github.sha }})
          body: |
            自动构建于 commit `${{ github.sha }}`
            分支: `${{ github.ref_name }}`
          files: ${{ env.ARCHIVE }}
          draft: false
          prerelease: true                    # 标记为预发布，避免覆盖正式版
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
