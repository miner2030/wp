name: Release Rust Binaries

on:
  push:
    tags:
      - 'v*' # 当推送形如 v0.1.0 的 Tag 时自动触发构建

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: wp-v0.1.0-x86_64-unknown-linux-gnu.tar.gz
            asset_name: wp-linux-amd64
          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: wp-v0.1.0-x86_64-pc-windows-msvc.zip
            asset_name: wp-windows-amd64.exe
          # macOS x86_64 (Intel)
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: wp-v0.1.0-x86_64-apple-darwin.tar.gz
            asset_name: wp-macos-x86_64
          # macOS aarch64 (Apple Silicon M1/M2/M3)
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: wp-v0.1.0-aarch64-apple-darwin.tar.gz
            asset_name: wp-macos-arm64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Binary (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release/
          tar -czvf ../../../${{ matrix.artifact_name }} wp
          cd -

      - name: Package Binary (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/wp.exe -DestinationPath ${{ matrix.artifact_name }}

      - name: Upload Artifacts to Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
