name: Release Rust Binaries

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    name: Determine next version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 需要完整历史才能拿到已有 tag

      - name: Calculate next version
        id: version
        run: |
          # 获取最新的 vX.Y.Z 格式 tag
          LATEST=$(git tag -l 'v*.*.*' --sort=-v:refname | head -n1)

          if [ -z "$LATEST" ]; then
            # 没有任何版本 tag → 首发 v0.1.0
            NEXT="0.1.0"
          else
            # 去掉前缀 v
            VER="${LATEST#v}"
            # 拆分 major.minor.patch
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VER"
            # 自动递增 patch
            PATCH=$((PATCH + 1))
            NEXT="${MAJOR}.${MINOR}.${PATCH}"
          fi

          echo "version=${NEXT}" >> $GITHUB_OUTPUT
          echo "tag=v${NEXT}" >> $GITHUB_OUTPUT
          echo "Next version will be: v${NEXT}"

  build-and-release:
    name: Build (${{ matrix.target }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: wp-linux-64
            is_windows: false
          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: wp-windows-64
            is_windows: true
          # macOS Intel
          - os: macos-latest
            target: x86_64-apple-darwin
            asset_name: wp-macos-64
            is_windows: false
          # macOS Apple Silicon
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_name: wp-macos-arm64
            is_windows: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Linux / macOS)
        if: matrix.is_windows == false
        run: |
          # 重命名二进制为你想要的名字
          cp "target/${{ matrix.target }}/release/wp" "${{ matrix.asset_name }}"
          chmod +x "${{ matrix.asset_name }}"
          # 打成 tar.gz
          tar -czvf "${{ matrix.asset_name }}.tar.gz" "${{ matrix.asset_name }}"
          echo "ARCHIVE=${{ matrix.asset_name }}.tar.gz" >> $GITHUB_ENV

      - name: Package (Windows)
        if: matrix.is_windows == true
        shell: pwsh
        run: |
          # 重命名并打包
          Copy-Item "target/${{ matrix.target }}/release/wp.exe" "${{ matrix.asset_name }}.exe"
          Compress-Archive -Path "${{ matrix.asset_name }}.exe" -DestinationPath "${{ matrix.asset_name }}.zip"
          echo "ARCHIVE=${{ matrix.asset_name }}.zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          body: |
            ## ${{ needs.prepare.outputs.tag }}

            自动构建于 commit `${{ github.sha }}`
            分支: `${{ github.ref_name }}`

            ### 下载

            | 平台 | 文件 |
            |------|------|
            | Linux x86_64 | `wp-linux-64.tar.gz` |
            | Windows x86_64 | `wp-windows-64.zip` |
            | macOS Intel | `wp-macos-64.tar.gz` |
            | macOS Apple Silicon | `wp-macos-arm64.tar.gz` |
          files: ${{ env.ARCHIVE }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
